<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro • {{loja.nome}}</title><style>body{font-family:Arial;background:#f4f7fb;color:#142033;margin:0}.w{max-width:760px;margin:auto;padding:30px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:25px;box-shadow:0 12px 35px #10213b12}.field{width:100%;padding:11px;border:1px solid #dce3ec;border-radius:9px;margin:6px 0 14px;box-sizing:border-box}.btn{border:0;background:#1267e8;color:white;padding:12px 16px;border-radius:9px;font-weight:800;cursor:pointer}.muted{color:#68788e}.notice{padding:12px;background:#fff6db;border-radius:10px;margin-bottom:12px}</style></head><body><div class="w"><div class="card"><h1>Primeiro acesso</h1><p class="muted">Solicite seu vínculo com <b>{{loja.nome}}</b>. O gestor valida os dados antes de liberar sua conta.</p>{% for m in messages %}<div class="notice">{{m}}</div>{% endfor %}<form method="post">{% csrf_token %}<label>Nome completo</label><input class="field" name="nome" required><label>E-mail corporativo ou pessoal</label><input class="field" name="email" type="email" required><label>CPF</label><input class="field" name="cpf" placeholder="000.000.000-00"><label>Cargo / função</label><input class="field" name="cargo"><label>Setor</label><select class="field" name="setor"><option value="">Selecione</option>{% for s in setores %}<option value="{{s.id}}">{{s.nome}}</option>{% endfor %}</select><label>Supervisor / gestor direto</label><select class="field" name="supervisor"><option value="">Não sei / não listado</option>{% for c in supervisores %}<option value="{{c.id}}">{{c}}</option>{% endfor %}</select><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="privacidade" required> <span>Estou ciente de que estes dados serão usados para validar meu vínculo e administrar meu acesso à plataforma da empresa.</span></label><p><button class="btn">Enviar cadastro para aprovação</button></p></form><p><a href="{% url 'portal_empresa_publica' loja.slug %}">← Voltar ao Portal da Empresa</a></p></div></div></body></html>
