<div class="task"><div class="priority {{x.prioridade}}"><details style="margin-top:8px"><summary>Comentários</summary>{% for c in x.comentarios.all %}<small><b>{{c.autor|default:"Sistema"}}</b>: {{c.texto}}</small>{% endfor %}<form method="post" action="{% url 'gestao_comentar_tarefa' x.id %}">{% csrf_token %}<input class="mini" name="texto" maxlength="500" placeholder="Comentar ou registrar evidência…" required><button class="btn alt" style="margin-top:6px">Enviar</button></form></details></div><b>{{x.titulo}}</b><small>{{x.responsavel|default:'Sem responsável'}}</small>{% if x.fim %}<small>Prazo {{x.fim|date:'d/m/Y'}}</small>{% endif %}<form method="post" action="{% url 'gestao_tarefa_status' %}">{% csrf_token %}<input type="hidden" name="id" value="{{x.id}}"><select class="mini" name="status" onchange="this.form.submit()"><option value="">Mover…</option><option value="backlog">Backlog</option><option value="fazer">A fazer</option><option value="andamento">Em andamento</option><option value="revisao">Revisão</option><option value="concluida">Concluída</option></select></form></div>
