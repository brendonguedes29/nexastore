<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar empresa | NexaStore</title><style>body{font-family:Arial;background:#07111f;color:#fff;margin:0}.box{max-width:520px;margin:55px auto;background:#fff;color:#172033;padding:32px;border-radius:18px}.box h1{margin-top:0}.box input{width:100%;padding:12px;border:1px solid #d8e0ea;border-radius:9px;margin:6px 0 14px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#1267e8;color:#fff;font-weight:800}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px}</style></head><body><div class="box"><h1>Crie o ambiente da sua empresa</h1><p>Comece a organizar processos, qualidade, indicadores e melhoria contínua.</p>{% if erro %}<div class="err">{{ erro }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Responsável</label><input name="nome_responsavel" value="{{ valores.nome_responsavel }}" required><label>Empresa</label><input name="nome_loja" value="{{ valores.nome_loja }}" required><label>E-mail corporativo</label><input type="email" name="email" value="{{ valores.email }}" required><label>Telefone</label><input name="telefone" value="{{ valores.telefone }}"><label>Senha</label><input type="password" name="senha" required><label>Confirmar senha</label><input type="password" name="confirmar_senha" required><button class="btn">Criar ambiente NexaStore</button></form></div></body></html>
